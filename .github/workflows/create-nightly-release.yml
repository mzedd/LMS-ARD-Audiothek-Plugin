name: Create nightly release

on:
  push:
    branches:
      - develop

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  create-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build release assets
        run: |
          mkdir -p dist
          zip -qr dist/ARDAudiothek.zip ARDAudiothek
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          repo = ET.parse("repo.xml")
          plugin = repo.find("./plugins/plugin[@name='ARDAudiothek']")
          plugin.find("sha").text = hashlib.sha1(Path("dist/ARDAudiothek.zip").read_bytes()).hexdigest()
          plugin.find("url").text = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              "/releases/download/nightly/ARDAudiothek.zip"
          )
          repo.write("dist/repo.xml", encoding="utf-8")
          PY

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_id="$(gh api --paginate "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.tag_name == "nightly") | .id')"
          if [[ -n "$release_id" ]]; then
            gh release delete nightly --yes
          fi

          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          gh release create nightly dist/ARDAudiothek.zip dist/repo.xml \
            --verify-tag \
            --title "Nightly build" \
            --notes "Automated build from develop at commit ${GITHUB_SHA}." \
            --prerelease \
            --latest=false
